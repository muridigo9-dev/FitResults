name: 🔑 Sync fulfillment signing secret

# Pushes FULFILLMENT_SIGNING_SECRET from this repository's secrets into the
# project's Edge Function secrets, where `provision-from-quiz` reads it.
#
# It exists because that secret has to be byte-identical in two places — here
# and on the quiz funnel's VPS — and the one time it was copied by hand it went
# in wrong twice, which shows up only as `401 Invalid signature` on every
# delivery. Copying by machine removes the failure mode.
#
# To rotate: update the secret on the VPS
# (/opt/tai-chi/app/.env.production), update FULFILLMENT_SIGNING_SECRET in this
# repository's Actions secrets, then run this workflow. Deliveries signed with
# the old value fail with 401, which is retryable, so anything in flight during
# the swap heals itself on the next drain rather than being lost.

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      FULFILLMENT_SIGNING_SECRET: ${{ secrets.FULFILLMENT_SIGNING_SECRET }}

    steps:
      - name: 🛑 Check the secret is actually set
        run: |
          if [ -z "$FULFILLMENT_SIGNING_SECRET" ]; then
            echo "❌ FULFILLMENT_SIGNING_SECRET is empty in this repository's Actions secrets."
            exit 1
          fi
          echo "✅ present (${#FULFILLMENT_SIGNING_SECRET} characters)"

      - name: 🔧 Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: 🔐 Login Supabase
        run: supabase login --token "$SUPABASE_ACCESS_TOKEN"

      - name: 🔑 Set the Edge Function secret
        run: |
          # Written to a file rather than passed as NAME=VALUE on the command
          # line, so the value never appears in this runner's process list.
          umask 077
          printf 'FULFILLMENT_SIGNING_SECRET=%s\n' "$FULFILLMENT_SIGNING_SECRET" > .fulfillment.env
          supabase secrets set --env-file .fulfillment.env --project-ref "$SUPABASE_PROJECT_ID"
          rm -f .fulfillment.env
          echo "✅ synced to project $SUPABASE_PROJECT_ID"
