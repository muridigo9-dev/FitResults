# Configure this with your own Supabase project ID
# Or use GitHub Secrets for CI/CD workflows
project_id = "your-project-id"

[functions.get-manifest]
verify_jwt = false

[functions.send-push-notification]
verify_jwt = false

[functions.process-cancellation]
verify_jwt = false

[functions.send-email]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# Administrative Stripe actions (save_keys / validate_key / get_price). These
# used to ride inside stripe-webhook, which had to stay open for Stripe to
# reach it — one endpoint cannot be both "public, signed by Stripe" and
# "administrative, signed by a JWT". JWT-gated here, plus an `admin` role check.
[functions.stripe-admin]
verify_jwt = true

# Machine-to-machine: the quiz funnel POSTs signed fulfillment orders here.
# verify_jwt = false because the caller is a server with no Supabase session —
# it authenticates with an HMAC over the raw body (x-moove-signature), verified
# before the body is parsed. See docs/integration/quiz-app-junction.md in the
# quiz repo.
[functions.provision-from-quiz]
verify_jwt = false

# Public pricing. The landing page renders it for logged-out visitors, and the
# response carries nothing that is not already visible on the checkout page.
[functions.list-plans]
verify_jwt = false

[functions.create-checkout-session]
verify_jwt = false

[functions.create-billing-portal-session]
verify_jwt = false

[functions.create-test-user]
verify_jwt = false

[functions.send-password-reset]
verify_jwt = false

[functions.admin-force-password-change]
verify_jwt = false

# provision-admin and provision-test-users used to be declared here with
# verify_jwt = false and no auth check of their own. Both created accounts
# holding the `admin` role, with passwords hardcoded in this repository, for
# anyone who sent an unauthenticated POST. Their source is deleted; seed
# accounts belong in the migrations that the setup workflows already run
# (20260101000023_provision_default_admin.sql and
# 20260101000041_provision_test_users.sql).
#
# Deleting the source does not retire the deployed function: `supabase
# functions deploy` only ever adds and updates, so a function stays live and
# callable until it is explicitly deleted. Both were removed from the project
# with the delete-edge-function workflow. Anything dropped from this directory
# in future needs that same second step.
